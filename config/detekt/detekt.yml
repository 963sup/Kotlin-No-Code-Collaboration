# Detekt Configuration: Optimized for Jetpack Compose & Clean Architecture
# Maximizes signal-to-noise ratio by eliminating declarative UI false positives
# while enforcing strict structural correctness, error prevention, and clean flows.

config:
  validation: true
  warningsAsErrors: false

naming:
  ForbiddenClassName:
    active: true
    forbiddenName:
      - "WbsTask"
      - "KanbanTask"
      - "MyWorkTask"
      - "GitCommit"
      - "PullRequest"
      - "Branch"
      - "Diff"
  FunctionNaming:
    ignoreAnnotated:
      - "Composable"
  TopLevelPropertyNaming:
    constantPattern: "[A-Z][_A-Za-z0-9]*|[a-z][A-Za-z0-9]*"
  MatchingDeclarationName:
    active: false

style:
  MagicNumber:
    active: false
  MaxLineLength:
    active: false
  WildcardImport:
    active: false
  UnusedParameter:
    active: false
  UnusedPrivateFunction:
    ignoreAnnotated:
      - "Preview"
  ReturnCount:
    active: false
  DestructuringDeclarationWithTooManyEntries:
    active: false
  LoopWithTooManyJumpStatements:
    active: false

exceptions:
  active: true
  TooGenericExceptionCaught:
    active: true
  SwallowedException:
    active: true
  ThrowingExceptionsWithoutMessageOrCause:
    active: true

complexity:
  active: true
  LargeClass:
    active: true
    allowedLines: 600
  LongMethod:
    active: true
    allowedLines: 100
  TooManyFunctions:
    active: true
    allowedFunctionsPerClass: 30
    allowedFunctionsPerFile: 30
    allowedFunctionsPerInterface: 30
    ignoreAnnotatedFunctions:
      - "Composable"
      - "Preview"
  CyclomaticComplexMethod:
    active: true
    allowedComplexity: 30
  CognitiveComplexMethod:
    active: true
    allowedComplexity: 30

coroutines:
  active: true
  GlobalCoroutineUsage:
    active: true
  RedundantSuspendModifier:
    active: true
  SleepInsteadOfDelay:
    active: true
  SuspendFunWithFlowReturnType:
    active: true

potential-bugs:
  active: true
  UnreachableCode:
    active: true
  EqualsWithHashCodeExist:
    active: true
  DontDowncastCollectionTypes:
    active: true
  UnconditionalJumpStatementInLoop:
    active: true
  CastToNullableType:
    active: true
  UselessPostfixExpression:
    active: true

ktlint:
  active: true
  autoCorrect: true
  NoWildcardImports:
    active: false
  MaximumLineLength:
    active: false
  PackageName:
    active: false
  MixedConditionOperators:
    active: false
  PropertyName:
    active: false





