# Detekt is advisory in the initial rollout. Keep high-signal correctness and complexity rules,
# while removing style noise that is expected in Jetpack Compose and the existing Android codebase.

naming:
  FunctionNaming:
    functionPattern: '[a-zA-Z][a-zA-Z0-9]*'
  MatchingDeclarationName:
    active: false

style:
  MagicNumber:
    active: false
  MaxLineLength:
    active: false

complexity:
  TooManyFunctions:
    active: false
