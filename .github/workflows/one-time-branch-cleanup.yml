name: One-time branch cleanup

on:
  push:
    branches: ["main"]
    paths: [".github/workflows/one-time-branch-cleanup.yml"]

permissions:
  contents: write

jobs:
  cleanup:
    if: github.event.head_commit.message != 'chore: remove one-time branch cleanup'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Delete completed temporary branches
        shell: bash
        run: |
          set -euo pipefail
          git push origin --delete chore/github-aistudio-mainline-cleanup || true
          git push origin --delete feat/fpt-occam-8020-collaboration-20260818 || true

      - name: Remove this one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/one-time-branch-cleanup.yml
          git add -A
          git commit -m "chore: remove one-time branch cleanup"
          git push origin HEAD:main
