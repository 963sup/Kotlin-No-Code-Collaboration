name: Apply Mobile Collaboration MVP

on:
  push:
    branches:
      - agent/mobile-collaboration-mvp
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  implement-and-verify:
    if: github.actor != 'github-actions[bot]' && (github.event_name == 'push' || github.event.pull_request.head.ref == 'agent/mobile-collaboration-mvp')
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v7
        with:
          ref: agent/mobile-collaboration-mvp
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.3.1'

      - name: Validate implementation runner
        run: python3 -m py_compile .github/scripts/agent_mobile_collaboration_mvp.py

      - name: Apply bounded implementation
        run: python3 .github/scripts/agent_mobile_collaboration_mvp.py

      - name: Check patch integrity
        run: git diff --check

      - name: Run JVM tests
        run: gradle :app:testDebugUnitTest --stacktrace

      - name: Assemble debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Commit verified implementation
        shell: bash
        run: |
          rm -f .github/scripts/agent_mobile_collaboration_mvp.py
          rm -f .github/workflows/agent-mobile-collaboration-mvp.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No implementation delta was produced."
            exit 1
          fi
          git commit -m "feat: establish light mobile collaboration shell"
          git push origin HEAD:agent/mobile-collaboration-mvp
