name: Apply Mobile Collaboration MVP

on:
  push:
    branches:
      - agent/mobile-collaboration-mvp
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  implement-and-verify:
    if: github.actor != 'github-actions[bot]' && (github.event_name == 'push' || github.event.pull_request.head.ref == 'agent/mobile-collaboration-mvp')
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v7
        with:
          ref: agent/mobile-collaboration-mvp
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.3.1'

      - name: Validate bounded implementation runners
        run: |
          python3 -m py_compile .github/scripts/agent_mobile_wbs_mvp.py
          python3 -m py_compile .github/scripts/agent_mobile_collaboration_mvp.py

      - name: Materialize previously verified WBS slice and repair baseline syntax
        run: python3 .github/scripts/agent_mobile_wbs_mvp.py

      - name: Apply bounded mobile collaboration implementation
        run: python3 .github/scripts/agent_mobile_collaboration_mvp.py

      - name: Align localized app-name smoke test
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("app/src/test/java/com/example/ExampleRobolectricTest.kt")
          source = path.read_text(encoding="utf-8")
          old = 'assertEquals("RepoGovernance", appName)'
          new = 'assertEquals("協作治理", appName)'
          if source.count(old) != 1:
              raise SystemExit("Expected exactly one stale app-name assertion")
          path.write_text(source.replace(old, new, 1), encoding="utf-8")
          PY

      - name: Restore portable debug signing
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("app/build.gradle.kts")
          source = path.read_text(encoding="utf-8")
          custom_debug_signing = '''    create("debugConfig") {
              storeFile = file("${rootDir}/debug.keystore")
              storePassword = "android"
              keyAlias = "androiddebugkey"
              keyPassword = "android"
            }
          '''
          custom_debug_assignment = '    debug { signingConfig = signingConfigs.getByName("debugConfig") }\n'
          if source.count(custom_debug_signing) != 1:
              raise SystemExit("Expected exactly one custom debug signing configuration")
          if source.count(custom_debug_assignment) != 1:
              raise SystemExit("Expected exactly one custom debug signing assignment")
          source = source.replace(custom_debug_signing, "", 1)
          source = source.replace(custom_debug_assignment, "", 1)
          path.write_text(source, encoding="utf-8")
          PY

      - name: Reject known corrupted Kotlin identifiers
        run: |
          python3 - <<'PY'
          from pathlib import Path

          forbidden = (
              "associate由",
              "group由",
              "sorted由",
              "distinct由",
              "then由",
              "currentBlocked由",
              "onUpdateIssue狀態",
              "onUpdate狀態",
              "new狀態",
              "notificationFilter狀態",
              "role範圍",
          )
          violations = []
          for path in Path("app/src").rglob("*.kt"):
              text = path.read_text(encoding="utf-8")
              for token in forbidden:
                  if token in text:
                      violations.append(f"{path}: {token}")
          if violations:
              raise SystemExit("Known identifier corruption remains:\n" + "\n".join(violations))
          PY

      - name: Check patch integrity
        run: git diff --check

      - name: Run JVM tests
        run: gradle :app:testDebugUnitTest --stacktrace

      - name: Assemble debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Commit verified implementation
        shell: bash
        run: |
          rm -f .github/scripts/agent_mobile_wbs_mvp.py
          rm -f .github/workflows/agent-mobile-wbs-mvp.yml
          rm -f .github/scripts/agent_mobile_collaboration_mvp.py
          rm -f .github/workflows/agent-mobile-collaboration-mvp.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No implementation delta was produced."
            exit 1
          fi
          git commit -m "feat: deliver verified mobile collaboration MVP"
          git push origin HEAD:agent/mobile-collaboration-mvp
