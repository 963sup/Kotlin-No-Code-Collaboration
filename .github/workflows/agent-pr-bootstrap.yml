name: Bootstrap Collaboration Target Implementation

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  bootstrap:
    if: github.event.pull_request.head.ref == 'agent/collaboration-target-inbox' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v7
        with:
          ref: agent/collaboration-target-inbox
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.3.1'

      - name: Repair bounded identifier corruption and apply feature slice
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          # A prior UI localization pass translated fragments inside Kotlin API
          # identifiers and punctuation. Repair only code tokens; preserve all
          # user-visible Traditional Chinese strings verbatim.
          identifier_repairs = {
              'associate由': 'associateBy',
              'group由': 'groupBy',
              'sorted由': 'sortedBy',
              'distinct由': 'distinctBy',
              'then由': 'thenBy',
              'onUpdateIssue狀態': 'onUpdateIssueStatus',
              'onUpdate狀態': 'onUpdateStatus',
              'new狀態': 'newStatus',
              'notificationFilter狀態': 'notificationFilterStatus',
              'role範圍': 'roleScope',
          }

          def normalize_code_punctuation(source: str) -> str:
              """Replace full-width colon only in Kotlin code, never in strings/comments."""
              output = []
              index = 0
              state = 'code'
              block_depth = 0

              while index < len(source):
                  if state == 'code':
                      if source.startswith('//', index):
                          output.append('//')
                          index += 2
                          state = 'line_comment'
                          continue
                      if source.startswith('/*', index):
                          output.append('/*')
                          index += 2
                          state = 'block_comment'
                          block_depth = 1
                          continue
                      if source.startswith('"""', index):
                          output.append('"""')
                          index += 3
                          state = 'triple_string'
                          continue
                      char = source[index]
                      if char == '"':
                          output.append(char)
                          index += 1
                          state = 'string'
                          continue
                      if char == "'":
                          output.append(char)
                          index += 1
                          state = 'char'
                          continue
                      output.append(':' if char == '：' else char)
                      index += 1
                      continue

                  if state == 'line_comment':
                      char = source[index]
                      output.append(char)
                      index += 1
                      if char == '\n':
                          state = 'code'
                      continue

                  if state == 'block_comment':
                      if source.startswith('/*', index):
                          output.append('/*')
                          index += 2
                          block_depth += 1
                          continue
                      if source.startswith('*/', index):
                          output.append('*/')
                          index += 2
                          block_depth -= 1
                          if block_depth == 0:
                              state = 'code'
                          continue
                      output.append(source[index])
                      index += 1
                      continue

                  if state == 'triple_string':
                      if source.startswith('"""', index):
                          output.append('"""')
                          index += 3
                          state = 'code'
                      else:
                          output.append(source[index])
                          index += 1
                      continue

                  if state == 'string':
                      char = source[index]
                      output.append(char)
                      index += 1
                      if char == '\\' and index < len(source):
                          output.append(source[index])
                          index += 1
                      elif char == '"':
                          state = 'code'
                      continue

                  if state == 'char':
                      char = source[index]
                      output.append(char)
                      index += 1
                      if char == '\\' and index < len(source):
                          output.append(source[index])
                          index += 1
                      elif char == "'":
                          state = 'code'
                      continue

              return ''.join(output)

          repaired_files = []
          for kotlin_file in Path('app/src/main/java').rglob('*.kt'):
              original = kotlin_file.read_text(encoding='utf-8')
              repaired = original
              for corrupted, canonical in identifier_repairs.items():
                  repaired = repaired.replace(corrupted, canonical)
              repaired = normalize_code_punctuation(repaired)
              if repaired != original:
                  kotlin_file.write_text(repaired, encoding='utf-8')
                  repaired_files.append(str(kotlin_file))

          print('Repaired compiler-breaking Kotlin tokens in:')
          for repaired_file in repaired_files:
              print(f'  - {repaired_file}')

          workflow = Path('.github/workflows/agent-collaboration-target.yml').read_text(encoding='utf-8')
          start_marker = "          python3 - <<'PY'\n"
          end_marker = "\n          PY\n\n      - name: Run JVM tests"
          start = workflow.index(start_marker) + len(start_marker)
          end = workflow.index(end_marker, start)
          script_lines = workflow[start:end].splitlines()
          script = "\n".join(
              line[10:] if line.startswith("          ") else line
              for line in script_lines
          )

          helper_old = """def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f'{label}: expected exactly one match, found {count}')
              return text.replace(old, new, 1)
          """
          helper_new = """def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count == 1:
                  return text.replace(old, new, 1)

              anchors = {
                  'Inbox notification action': '                    onPerformAction = {',
                  'Inbox inspection navigation': '            onNavigateToEntity = {',
              }
              anchor = anchors.get(label)
              if anchor is None:
                  raise RuntimeError(f'{label}: expected exactly one match, found {count}')

              start = text.index(anchor)
              open_brace = text.index('{', start)
              depth = 0
              for index in range(open_brace, len(text)):
                  char = text[index]
                  if char == '{':
                      depth += 1
                  elif char == '}':
                      depth -= 1
                      if depth == 0:
                          return text[:start] + new.rstrip('\\n') + text[index + 1:]
              raise RuntimeError(f'{label}: structural closing brace not found')
          """
          if helper_old not in script:
              raise RuntimeError('replace_once helper source was not found')
          script = script.replace(helper_old, helper_new, 1)

          exec(compile(script, 'embedded-collaboration-target-implementation.py', 'exec'))
          PY

      - name: Run JVM tests
        run: gradle :app:testDebugUnitTest --continue

      - name: Assemble debug APK
        run: gradle :app:assembleDebug

      - name: Commit verified implementation and remove temporary workflows
        shell: bash
        run: |
          rm -f .github/workflows/agent-collaboration-target.yml
          rm -f .github/workflows/agent-pr-bootstrap.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: restore Kotlin identifiers and open exact Inbox targets"
          git push origin HEAD:agent/collaboration-target-inbox
