name: Bootstrap Collaboration Target Implementation

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  bootstrap:
    if: github.event.pull_request.head.ref == 'agent/collaboration-target-inbox' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v7
        with:
          ref: agent/collaboration-target-inbox
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.3.1'

      - name: Execute bounded implementation script
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/agent-collaboration-target.yml').read_text(encoding='utf-8')
          start_marker = "          python3 - <<'PY'\n"
          end_marker = "\n          PY\n\n      - name: Run JVM tests"
          start = workflow.index(start_marker) + len(start_marker)
          end = workflow.index(end_marker, start)
          script_lines = workflow[start:end].splitlines()
          script = "\n".join(
              line[10:] if line.startswith("          ") else line
              for line in script_lines
          )
          exec(compile(script, 'embedded-collaboration-target-implementation.py', 'exec'))
          PY

      - name: Run JVM tests
        run: gradle :app:testDebugUnitTest --continue

      - name: Assemble debug APK
        run: gradle :app:assembleDebug

      - name: Commit verified implementation and remove temporary workflows
        shell: bash
        run: |
          rm -f .github/workflows/agent-collaboration-target.yml
          rm -f .github/workflows/agent-pr-bootstrap.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: open exact collaboration targets from inbox"
          git push origin HEAD:agent/collaboration-target-inbox
