name: Codex Finalize Mobile Collaboration v2 v2

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: codex-finalize-mobile-v2-v2
  cancel-in-progress: false

jobs:
  finalize:
    if: >-
      github.event.issue.pull_request &&
      github.event.issue.number == 21 &&
      github.event.comment.user.login == '963sup' &&
      github.event.comment.body == '/codex-finalize-mobile-v2-v2'
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/mobile-collaboration-v2
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Materialize, harden, test, and commit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          exec > >(tee /tmp/codex-mobile-v2-all.log) 2>&1
          report_failure() {
            code=$?
            tail -n 320 /tmp/codex-mobile-v2-all.log > /tmp/codex-mobile-v2-tail.log || true
            {
              echo '## Codex v2 finalizer failed — PR remains unmerged'
              echo
              echo '```text'
              cat /tmp/codex-mobile-v2-tail.log
              echo '```'
            } > /tmp/codex-mobile-v2-comment.md
            gh pr comment 21 --repo "$GITHUB_REPOSITORY" --body-file /tmp/codex-mobile-v2-comment.md || true
            exit "$code"
          }
          trap report_failure ERR

          python3 -m py_compile .github/scripts/*.py
          python3 .github/scripts/implement_mobile_collaboration_v2_data.py
          python3 .github/scripts/implement_mobile_collaboration_v2_ui_models.py
          python3 .github/scripts/implement_mobile_collaboration_v2_integration.py
          python3 .github/scripts/implement_mobile_collaboration_v2_validation.py
          python3 .github/scripts/repair_mobile_collaboration_v2.py
          python3 .github/scripts/harden_mobile_collaboration_v2.py
          python3 .github/scripts/finalize_mobile_collaboration_v2.py

          cat > app/src/test/java/com/example/AppMigration45Test.kt <<'KOTLIN'
          package com.example

          import android.content.Context
          import androidx.sqlite.db.SupportSQLiteDatabase
          import androidx.sqlite.db.SupportSQLiteOpenHelper
          import androidx.sqlite.db.framework.FrameworkSQLiteOpenHelperFactory
          import androidx.test.core.app.ApplicationProvider
          import com.example.data.local.AppMigrations
          import org.junit.Assert.assertEquals
          import org.junit.Assert.assertTrue
          import org.junit.Test
          import org.junit.runner.RunWith
          import org.robolectric.RobolectricTestRunner
          import org.robolectric.annotation.Config

          @RunWith(RobolectricTestRunner::class)
          @Config(sdk = [35])
          class AppMigration45Test {
              @Test
              fun migration4To5PreservesExistingIssueAndCreatesNewSchema() {
                  val context = ApplicationProvider.getApplicationContext<Context>()
                  val databaseName = "migration-4-5-${System.nanoTime()}.db"
                  context.deleteDatabase(databaseName)
                  val helper = FrameworkSQLiteOpenHelperFactory().create(
                      SupportSQLiteOpenHelper.Configuration.builder(context)
                          .name(databaseName)
                          .callback(object : SupportSQLiteOpenHelper.Callback(4) {
                              override fun onCreate(db: SupportSQLiteDatabase) {
                                  db.execSQL("CREATE TABLE repo_issues (id TEXT NOT NULL PRIMARY KEY, issueNumber INTEGER NOT NULL, title TEXT NOT NULL, status TEXT NOT NULL)")
                                  db.execSQL("INSERT INTO repo_issues(id, issueNumber, title, status) VALUES('iss_existing', 7, 'Existing field task', 'CLOSED')")
                              }
                              override fun onUpgrade(db: SupportSQLiteDatabase, oldVersion: Int, newVersion: Int) = Unit
                          })
                          .build()
                  )
                  try {
                      val db = helper.writableDatabase
                      AppMigrations.MIGRATION_4_5.migrate(db)
                      db.query("SELECT title, sortOrder, progressPercent, wbsWeight FROM repo_issues WHERE id = 'iss_existing'").use { cursor ->
                          assertTrue(cursor.moveToFirst())
                          assertEquals("Existing field task", cursor.getString(0))
                          assertEquals(7, cursor.getInt(1))
                          assertEquals(100, cursor.getInt(2))
                          assertEquals(1.0, cursor.getDouble(3), 0.0)
                      }
                      val columns = mutableSetOf<String>()
                      db.query("PRAGMA table_info(repo_issues)").use { cursor ->
                          val index = cursor.getColumnIndexOrThrow("name")
                          while (cursor.moveToNext()) columns += cursor.getString(index)
                      }
                      assertTrue(columns.containsAll(setOf("sortOrder", "plannedStartAt", "plannedEndAt", "wbsWeight", "progressPercent")))
                      val tables = mutableSetOf<String>()
                      db.query("SELECT name FROM sqlite_master WHERE type = 'table'").use { cursor ->
                          while (cursor.moveToNext()) tables += cursor.getString(0)
                      }
                      assertTrue(tables.containsAll(setOf("saved_targets", "user_follows", "sync_outbox", "sync_metadata", "sync_cursors", "sync_conflicts", "push_registrations", "sync_runtime_state")))
                  } finally {
                      helper.close()
                      context.deleteDatabase(databaseName)
                  }
              }
          }
          KOTLIN

          ! grep -R "fallbackToDestructiveMigration" -n app/src 2>/dev/null
          ! grep -R "data class WbsTask\|class WbsTask" -n app/src 2>/dev/null
          ! grep -R "ExistingWorkPolicy.REPLACE" -n app/src/main/java/com/example/sync 2>/dev/null
          ! grep -R "http://" -n app/src/main/java/com/example/sync 2>/dev/null
          grep -R "addMigrations(AppMigrations.MIGRATION_4_5)" -n app/src/main/java
          grep -R "database.withTransaction" -n app/src/main/java/com/example/sync/RemoteSync.kt
          grep -R "MAX_SYNC_PAYLOAD_CHARS" -n app/src/main/java/com/example/sync/RemoteSync.kt
          grep -R "untrusted sync hint" -n app/src/main/java
          grep -R "log.repoId in visibleRepositoryIds" -n app/src/main/java/com/example/ui/model/ExperienceProjections.kt
          git diff --check

          chmod +x ./gradlew
          ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleDebug --stacktrace

          rm -f .github/scripts/finalize_mobile_collaboration_v2.py
          rm -f .github/scripts/harden_mobile_collaboration_v2.py
          rm -f .github/scripts/implement_mobile_collaboration_v2_data.py
          rm -f .github/scripts/implement_mobile_collaboration_v2_integration.py
          rm -f .github/scripts/implement_mobile_collaboration_v2_ui_models.py
          rm -f .github/scripts/implement_mobile_collaboration_v2_validation.py
          rm -f .github/scripts/repair_mobile_collaboration_v2.py
          rm -f .github/workflows/agent-mobile-collaboration-v2.yml
          rm -f .github/workflows/agent-mobile-collaboration-v2-repair.yml
          rm -f .github/workflows/agent-mobile-collaboration-v2-security.yml
          rm -f .github/workflows/agent-mobile-collaboration-v2-final-gate.yml
          rm -f .github/workflows/agent-collaboration-target-workloop.yml
          rm -f .github/mobile-v2-build-failure.log .github/mobile-v2-security-failure.log
          git diff --check

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: finalize verified mobile collaboration v2"
          git push origin HEAD:feature/mobile-collaboration-v2
          sha=$(git rev-parse HEAD)
          gh pr ready 21 --repo "$GITHUB_REPOSITORY" || true
          gh pr comment 21 --repo "$GITHUB_REPOSITORY" --body "Codex v2 finalizer PASS at \`$sha\`: unit tests, debug assembly, executable Room 4→5 data-preservation test, and security invariants passed; temporary branch write automation was removed."
