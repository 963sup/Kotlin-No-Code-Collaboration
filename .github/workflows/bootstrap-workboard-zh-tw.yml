name: Bootstrap Repository Workboard zh-TW

on:
  push:
    branches: [ "agent/repository-workboard-zh-tw" ]
    paths:
      - ".github/scripts/apply_workboard_zh_tw.py"
      - ".github/workflows/bootstrap-workboard-zh-tw.yml"

permissions:
  contents: write

jobs:
  transform-build-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Apply bounded transformation
        run: python .github/scripts/apply_workboard_zh_tw.py

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Unit tests
        run: gradle :app:testDebugUnitTest --continue

      - name: Assemble debug APK
        run: gradle :app:assembleDebug

      - name: Commit verified application changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app metadata.json
          git diff --cached --stat
          git commit -m "feat: add repository workboard and Traditional Chinese UI"
          git push origin HEAD:agent/repository-workboard-zh-tw
