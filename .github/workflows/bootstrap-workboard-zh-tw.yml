name: Diagnose Repository Workboard Baseline

on:
  pull_request:
    branches: [ "main" ]
  push:
    branches: [ "agent/finalize-workboard-zh-tw" ]
    paths:
      - ".github/workflows/bootstrap-workboard-zh-tw.yml"
      - "gradle/libs.versions.toml"
      - "app/build.gradle.kts"
      - "build.gradle.kts"

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
      - name: Build environment
        run: gradle :app:buildEnvironment --no-configuration-cache
      - name: Compiler plugin classpath
        run: gradle :app:dependencies --configuration kotlinCompilerPluginClasspathDebug --no-configuration-cache || true
      - name: Baseline compile
        run: gradle :app:compileDebugKotlin --stacktrace --no-configuration-cache
