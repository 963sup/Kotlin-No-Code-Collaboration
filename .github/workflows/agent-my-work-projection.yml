          Path("docs/architecture/my-work-projection.md").write_text('''# My Work Projection｜First Principles Decision Record

          ## Objective

          Let a field member see and update every Issue assigned directly to them or to one of their Teams without first discovering and selecting each Repository.

          ## Facts

          - `RepoIssue` already stores optional USER or TEAM assignment.
          - MainActivity already restricts the Work screen to Repositories and Issues visible in the selected workspace scope.
          - The existing Work screen requires one Repository selection before any task is shown.
          - Kanban and WBS are projections of the same Repository-owned Issues.
          - WBS numbering is meaningful only inside one Repository tree.

          ## Assumptions

          - The active user is the correct default work audience.
          - Team assignment includes every TeamMembership held by the active user.

          ## Invariants

          - Repository remains the owner of every Issue.
          - No task, project, assignment, or WBS persistence model is added.
          - Existing access filtering remains authoritative; the projection cannot expand visibility.
          - WBS remains restricted to one Repository.
          - Status mutation continues through GovernanceViewModel and the existing repository path.

          ## Core Model

          - Entities: User, TeamMembership, Repository, RepoIssue.
          - Relationships: User belongs to Team; Issue is assigned to User or Team; Repository owns Issue.
          - States: assignment scope, optional Repository filter, Issue status, projection mode.
          - Events: choose My Work or All Work, choose optional Repository, move Issue status.
          - Responsibilities: pure projection filters records; MainActivity supplies scoped truth; ViewModel owns mutation.

          ## Root Constraint

          A mandatory Repository selector sits upstream of the work view, forcing repeated navigation even though assignment data already identifies the user's work.

          ## Highest-Leverage Change

          Make Repository filtering optional and project direct plus Team assignments across the already-authorized Issue set.

          ## Minimum Viable Change

          1. My Work is the default audience.
          2. Direct and Team assignments are aggregated across accessible Repositories.
          3. All Work remains available for the current workspace scope.
          4. Repository filtering is optional and includes an All Repositories choice.
          5. Cross-Repository cards identify their Repository.
          6. WBS is disabled until one Repository is selected.
          7. Pure unit tests lock assignment and Repository-filter behavior.

          ## Rejected Complexity

          - No new Room entity, DAO query, remote sync, due-date model, saved filter, global search, Favorite, Follow, or Achievement.
          - No new top-level screen or navigation framework.
          - No policy-engine change and no UI-side authorization decision.
          - No cross-Repository WBS numbering.

          ## Product Guardian

          - Verdict: ACCEPT.
          - Canonical owner: Repository owns Issues; User and Team are assignment grantees only.
          - Canonical container: current authorized workspace scope across Repositories.
          - Mobile placement: existing Work destination.
          - Governance impact: visibility is narrowed or preserved, never widened.

          ## Files To Change

          - MainActivity.kt
          - KanbanBoardScreen.kt
          - WorkProjection.kt
          - WorkProjectionTest.kt
          - this decision record

          ## Files Explicitly Not Changing

          - Room entities, DAO, database version, repository mutation logic, policy engine, Inbox, Repository workspace, and sync architecture.

          ## Verification Evidence

          - Pure tests prove direct assignment, Team assignment, unrelated exclusion, optional Repository filtering, All Work behavior, and null-user behavior.
          - `gradle :app:testDebugUnitTest` passes.
          - `gradle :app:assembleDebug` passes.
          - Diff inspection confirms no persistence, permission, ownership, or prohibited developer-product semantics.

          ## Stop Condition

          Stop when the existing Work destination opens on cross-Repository My Work, preserves optional All Work and Repository filters, restricts WBS to one Repository, and all declared checks pass.
          '''.replace("          ", ""), encoding="utf-8")
          PY

      - name: Run JVM tests
        run: gradle :app:testDebugUnitTest --continue

      - name: Assemble debug APK
        run: gradle :app:assembleDebug

      - name: Commit verified implementation and remove temporary workflow
        shell: bash
        run: |
          rm -f .github/workflows/agent-my-work-projection.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: aggregate assigned work across repositories"
          git push origin HEAD:feat/fpt-mobile-workflow-mvp
