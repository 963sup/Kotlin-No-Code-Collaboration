name: Implement Mobile Collaboration v2

on:
  push:
    branches:
      - feature/mobile-collaboration-v2
    paths:
      - .github/workflows/agent-mobile-collaboration-v2.yml
      - .github/scripts/implement_mobile_collaboration_v2_data.py
      - .github/scripts/implement_mobile_collaboration_v2_ui_models.py
      - .github/scripts/implement_mobile_collaboration_v2_integration.py
      - .github/scripts/implement_mobile_collaboration_v2_validation.py
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mobile-collaboration-v2-${{ github.ref }}
  cancel-in-progress: false

jobs:
  implement-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out implementation branch
        uses: actions/checkout@v4
        with:
          ref: feature/mobile-collaboration-v2
          fetch-depth: 0

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Apply staged implementation
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile .github/scripts/implement_mobile_collaboration_v2_*.py
          python3 .github/scripts/implement_mobile_collaboration_v2_data.py
          python3 .github/scripts/implement_mobile_collaboration_v2_ui_models.py
          python3 .github/scripts/implement_mobile_collaboration_v2_integration.py
          python3 .github/scripts/implement_mobile_collaboration_v2_validation.py

      - name: Static safety invariants
        shell: bash
        run: |
          set -euo pipefail
          ! grep -R "fallbackToDestructiveMigration" -n app/src/main/java app/src/main/kotlin 2>/dev/null
          ! grep -R "data class WbsTask\|class WbsTask" -n app/src 2>/dev/null
          grep -R "addMigrations(AppMigrations.MIGRATION_4_5)" -n app/src/main/java
          grep -R "CollaborationTargetAccess.canOpenRepository" -n app/src/main/java
          grep -R "FirebaseAuthTokenProvider" -n app/src/main/java
          grep -R "Push payloads are treated only as an untrusted sync hint" -n app/src/main/java
          git diff --check

      - name: Run JVM tests and assemble Debug APK
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew --no-daemon testDebugUnitTest assembleDebug --stacktrace

      - name: Remove temporary write surface
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/scripts/implement_mobile_collaboration_v2_data.py
          rm -f .github/scripts/implement_mobile_collaboration_v2_ui_models.py
          rm -f .github/scripts/implement_mobile_collaboration_v2_integration.py
          rm -f .github/scripts/implement_mobile_collaboration_v2_validation.py
          rm -f .github/workflows/agent-mobile-collaboration-v2.yml
          rm -f .github/workflows/agent-collaboration-target-workloop.yml
          git diff --check

      - name: Commit verified implementation
        shell: bash
        env:
          BRANCH_NAME: feature/mobile-collaboration-v2
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No implementation changes to commit"
            exit 1
          fi
          git commit -m "feat: implement mobile collaboration v2"
          git push origin "HEAD:${BRANCH_NAME}"

      - name: Upload verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-collaboration-v2-verification
          if-no-files-found: ignore
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results*.html
            app/build/outputs/apk/debug/*.apk
