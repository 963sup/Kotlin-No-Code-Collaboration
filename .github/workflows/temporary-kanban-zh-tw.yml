name: Temporary Kanban zh-TW Migration

on:
  pull_request:
    branches: [ "main" ]

permissions:
  contents: write

jobs:
  residual-zh-tw:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v7
        with:
          ref: agent/kanban-navigation-zh-tw
          fetch-depth: 0

      - name: Check residual marker
        id: marker
        shell: bash
        run: |
          if [ -f .github/zh-tw-residual-audit.txt ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Residual zh-TW pass already exists; no-op."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Apply residual zh-TW transformation
        if: ${{ steps.marker.outputs.skip == 'false' }}
        id: transform
        shell: bash
        run: |
          set +e
          python .github/scripts/apply_zh_tw_residuals.py > /tmp/zh-tw-pass-output.txt 2>&1
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          cat /tmp/zh-tw-pass-output.txt
          exit 0

      - name: Commit second-pass product changes
        if: ${{ steps.marker.outputs.skip == 'false' && steps.transform.outputs.status == '0' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app metadata.json .github/zh-tw-residual-audit.txt
          if git diff --cached --quiet; then
            echo "No residual changes"
            exit 0
          fi
          git commit -m "fix: 完成繁體中文 UI 第二輪校正 [generated-zh]"
          git push origin HEAD:agent/kanban-navigation-zh-tw

      - name: Commit residual translation error
        if: ${{ steps.marker.outputs.skip == 'false' && steps.transform.outputs.status != '0' }}
        run: |
          cp /tmp/zh-tw-pass-output.txt .github/zh-tw-residual-error.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/zh-tw-residual-error.txt
          git commit -m "chore: record residual translation error [zh-error]"
          git push origin HEAD:agent/kanban-navigation-zh-tw
