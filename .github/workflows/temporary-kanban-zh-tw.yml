name: Temporary Kanban zh-TW Migration

on:
  push:
    branches:
      - agent/kanban-navigation-zh-tw

permissions:
  contents: write

jobs:
  migrate:
    if: ${{ !contains(github.event.head_commit.message, '[generated]') && !contains(github.event.head_commit.message, '[migration-error]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: agent/kanban-navigation-zh-tw
          fetch-depth: 0

      - name: Apply bounded transformation
        id: migrate
        shell: bash
        run: |
          set +e
          python .github/scripts/apply_kanban_navigation_zh_tw.py > .github/kanban-migration-output.txt 2>&1
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          cat .github/kanban-migration-output.txt
          exit 0

      - name: Commit generated product changes
        if: ${{ steps.migrate.outputs.status == '0' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app metadata.json .github/kanban-migration-output.txt
          git commit -m "feat: 完成看板導覽、巢狀任務與繁體中文 UI [generated]"
          git push origin HEAD:agent/kanban-navigation-zh-tw

      - name: Commit migration error evidence
        if: ${{ steps.migrate.outputs.status != '0' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/kanban-migration-output.txt
          git commit -m "chore: record Kanban migration error [migration-error]"
          git push origin HEAD:agent/kanban-navigation-zh-tw
