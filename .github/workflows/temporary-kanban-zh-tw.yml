name: Temporary Kanban zh-TW Finalizer

on:
  pull_request:
    branches: [ "main" ]

permissions:
  contents: write

jobs:
  final-ui-literals:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v7
        with:
          ref: agent/kanban-navigation-zh-tw
          fetch-depth: 0

      - name: Check patch marker
        id: marker
        shell: bash
        run: |
          if [ -f .github/final-ui-patch-done.txt ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Patch final fixed UI literals
        if: ${{ steps.marker.outputs.skip == 'false' }}
        run: |
          python .github/scripts/patch_final_ui_literals.py
          echo "fixed-English UI literal check passed" > .github/final-ui-patch-done.txt

      - name: Commit final UI patch
        if: ${{ steps.marker.outputs.skip == 'false' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app .github/final-ui-patch-done.txt
          if git diff --cached --quiet; then
            echo "No final UI changes"
            exit 0
          fi
          git commit -m "fix: 清除最後固定英文 UI 字串 [generated-ui]"
          git push origin HEAD:agent/kanban-navigation-zh-tw
