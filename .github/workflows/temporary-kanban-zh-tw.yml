name: Temporary Kanban zh-TW Finalizer

on:
  pull_request:
    branches: [ "main" ]

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v7
        with:
          ref: agent/kanban-navigation-zh-tw
          fetch-depth: 0

      - name: Check finalization marker
        id: marker
        shell: bash
        run: |
          if [ -f .github/finalization-audit.txt ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Finalization already exists; no-op."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Apply finalization
        if: ${{ steps.marker.outputs.skip == 'false' }}
        id: finalize
        shell: bash
        run: |
          set +e
          python .github/scripts/finalize_kanban_zh_tw.py > /tmp/finalize-output.txt 2>&1
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          cat /tmp/finalize-output.txt
          exit 0

      - name: Commit final product and compatibility changes
        if: ${{ steps.marker.outputs.skip == 'false' && steps.finalize.outputs.status == '0' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app metadata.json gradle/libs.versions.toml build.gradle.kts .github/workflows/android.yml .github/finalization-audit.txt
          if git diff --cached --quiet; then
            echo "No finalization changes"
            exit 0
          fi
          git commit -m "fix: 對齊 Android 建置並完成繁體中文 UI [generated-final]"
          git push origin HEAD:agent/kanban-navigation-zh-tw

      - name: Commit finalization error evidence
        if: ${{ steps.marker.outputs.skip == 'false' && steps.finalize.outputs.status != '0' }}
        run: |
          cp /tmp/finalize-output.txt .github/finalization-error.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/finalization-error.txt
          git commit -m "chore: record finalization error [final-error]"
          git push origin HEAD:agent/kanban-navigation-zh-tw
