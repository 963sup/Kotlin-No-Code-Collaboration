name: Codex Security Fix Mobile v2 Final

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: codex-security-fix-mobile-v2-final
  cancel-in-progress: false

jobs:
  fix-and-verify:
    if: >-
      github.event.issue.pull_request &&
      github.event.issue.number == 21 &&
      github.event.comment.user.login == '963sup' &&
      github.event.comment.body == '/codex-security-fix-mobile-v2-final'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/mobile-collaboration-v2
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Apply bounded security fixes and verify
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          exec > >(tee /tmp/codex-security-final.log) 2>&1
          fail_report() {
            code=$?
            tail -n 320 /tmp/codex-security-final.log > /tmp/codex-security-final-tail.log || true
            {
              echo '## Codex Security final fix failed — PR remains unmerged'
              echo
              echo '```text'
              cat /tmp/codex-security-final-tail.log
              echo '```'
            } > /tmp/codex-security-final-comment.md
            gh pr comment 21 --repo "$GITHUB_REPOSITORY" --body-file /tmp/codex-security-final-comment.md || true
            exit "$code"
          }
          trap fail_report ERR

          python3 - <<'PY'
          from pathlib import Path

          def replace_exact(path, old, new, expected=1):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != expected:
                  raise RuntimeError(f'{path}: expected {expected} occurrences, found {count}')
              p.write_text(text.replace(old, new), encoding='utf-8')

          replace_exact(
              'app/src/main/java/com/example/data/repository/GovernanceRepository.kt',
              'if (evaluation.verdict != PolicyVerdict.ALLOWED && issue.authorUserId != actor.id)',
              'if (evaluation.verdict != PolicyVerdict.ALLOWED)'
          )

          replace_exact(
              'app/src/main/java/com/example/data/local/CollaborationExperienceDao.kt',
              "AND state IN ('PENDING', 'FAILED', 'IN_FLIGHT')",
              "AND state != 'SYNCED'"
          )

          triggers = Path('app/src/main/java/com/example/data/local/DatabaseSyncTriggers.kt')
          text = triggers.read_text(encoding='utf-8')
          reset = '        db.execSQL("UPDATE sync_runtime_state SET isApplyingRemote = 0 WHERE id = 1")'
          recover = '        db.execSQL("UPDATE sync_outbox SET state = \'PENDING\', lastError = \'Recovered interrupted sync\' WHERE state = \'IN_FLIGHT\'")'
          if recover not in text:
              if reset not in text:
                  raise RuntimeError('remote apply reset marker missing')
              text = text.replace(reset, reset + '\n' + recover, 1)
          old = "state IN ('PENDING', 'FAILED')"
          if text.count(old) != 2:
              raise RuntimeError(f'expected two trigger coalescing clauses, found {text.count(old)}')
          text = text.replace(old, "state IN ('PENDING', 'FAILED', 'AUTH_REQUIRED')")
          triggers.write_text(text, encoding='utf-8')

          replace_exact(
              'app/src/main/java/com/example/ui/screens/SocialProfileScreen.kt',
              '                Text("收藏 ${savedTargets.count { it.userId == profileUser.id }}")',
              '                if (profileUser.id == activeUser.id) {\n                    Text("收藏 ${savedTargets.count { it.userId == activeUser.id }}")\n                }'
          )
          PY

          # Security invariants from the final threat model.
          ! grep -R "fallbackToDestructiveMigration" -n app/src 2>/dev/null
          ! grep -R "data class WbsTask\|class WbsTask" -n app/src 2>/dev/null
          ! grep -R "ExistingWorkPolicy.REPLACE" -n app/src/main/java/com/example/sync 2>/dev/null
          ! grep -R "http://" -n app/src/main/java/com/example/sync 2>/dev/null
          ! grep -R "evaluation.verdict != PolicyVerdict.ALLOWED && issue.authorUserId" -n app/src/main/java/com/example/data/repository/GovernanceRepository.kt
          grep -R "AND state != 'SYNCED'" -n app/src/main/java/com/example/data/local/CollaborationExperienceDao.kt
          grep -R "Recovered interrupted sync" -n app/src/main/java/com/example/data/local/DatabaseSyncTriggers.kt
          grep -R "AUTH_REQUIRED')" -n app/src/main/java/com/example/data/local/DatabaseSyncTriggers.kt
          grep -R "profileUser.id == activeUser.id" -n app/src/main/java/com/example/ui/screens/SocialProfileScreen.kt
          grep -R "database.withTransaction" -n app/src/main/java/com/example/sync/RemoteSync.kt
          grep -R "MAX_SYNC_PAYLOAD_CHARS" -n app/src/main/java/com/example/sync/RemoteSync.kt
          grep -R "log.repoId in visibleRepositoryIds" -n app/src/main/java/com/example/ui/model/ExperienceProjections.kt
          grep -R "addMigrations(AppMigrations.MIGRATION_4_5)" -n app/src/main/java
          test ! -d .github/scripts/__pycache__
          git diff --check

          gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug --stacktrace

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "security: close final mobile collaboration integrity gaps"
          git push origin HEAD:feature/mobile-collaboration-v2
          sha=$(git rev-parse HEAD)
          gh pr comment 21 --repo "$GITHUB_REPOSITORY" --body "Codex Security final fix PASS at \`$sha\`: full JVM tests and debug assembly passed; WBS authorization bypass removed; AUTH_REQUIRED/CONFLICT now block remote overwrite; interrupted IN_FLIGHT work recovers; private favorites are no longer exposed on other profiles."
