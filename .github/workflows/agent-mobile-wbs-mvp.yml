name: Apply Mobile WBS MVP

on:
  push:
    branches:
      - agent/mobile-wbs-mvp

permissions:
  contents: write

jobs:
  implement-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v7
        with:
          ref: agent/mobile-wbs-mvp
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.3.1'

      - name: Apply bounded implementation
        run: python3 .github/scripts/agent_mobile_wbs_mvp.py

      - name: Check patch integrity
        run: git diff --check

      - name: Run JVM tests
        run: gradle :app:testDebugUnitTest --stacktrace

      - name: Assemble debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Commit verified implementation
        shell: bash
        run: |
          rm -f .github/scripts/agent_mobile_wbs_mvp.py
          rm -f .github/workflows/agent-mobile-wbs-mvp.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add mobile WBS projection over repository issues"
          git push origin HEAD:agent/mobile-wbs-mvp
