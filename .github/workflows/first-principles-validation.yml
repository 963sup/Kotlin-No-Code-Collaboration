name: First Principles Collaboration Validation

on:
  push:
    branches:
      - feat/fpt-occam-8020-collaboration-20260818
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Unit tests and debug assembly
        run: ./gradlew --no-daemon testDebugUnitTest assembleDebug

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: first-principles-test-reports
          path: |
            app/build/reports/tests/
            app/build/reports/problems/
          if-no-files-found: ignore
          retention-days: 7
