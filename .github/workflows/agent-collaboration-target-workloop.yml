name: Apply Collaboration Target Work Loop

on:
  push:
    branches:
      - agent/collaboration-target-workloop

permissions:
  contents: write

jobs:
  implement-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v7
        with:
          ref: agent/collaboration-target-workloop
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.3.1'

      - name: Apply bounded collaboration-target slice
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          source = Path('.github/workflows/agent-collaboration-target.yml').read_text(encoding='utf-8')
          start_marker = "          python3 - <<'PY'\n"
          end_marker = "\n          PY"
          start = source.index(start_marker) + len(start_marker)
          end = source.index(end_marker, start)
          body = source[start:end]
          body = "\n".join(
              line[10:] if line.startswith("          ") else line
              for line in body.splitlines()
          )
          Path('/tmp/apply_collaboration_target.py').write_text(body + "\n", encoding='utf-8')
          PY
          python3 /tmp/apply_collaboration_target.py

      - name: Run JVM tests
        run: gradle :app:testDebugUnitTest --continue

      - name: Assemble debug APK
        run: gradle :app:assembleDebug

      - name: Commit verified implementation and remove temporary workflows
        shell: bash
        run: |
          rm -f .github/workflows/agent-collaboration-target.yml
          rm -f .github/workflows/agent-collaboration-target-workloop.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: open exact collaboration targets from inbox"
          git push origin HEAD:agent/collaboration-target-workloop
