name: Apply Collaboration Target Slice

on:
  push:
    branches:
      - agent/collaboration-target-inbox

permissions:
  contents: write

jobs:
  implement-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v7
        with:
          ref: agent/collaboration-target-inbox
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.3.1'

      - name: Apply minimum coherent implementation
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          root = Path('.')
          inbox_path = root / 'app/src/main/java/com/example/ui/screens/InboxScreen.kt'
          target_path = root / 'app/src/main/java/com/example/navigation/CollaborationTarget.kt'
          test_path = root / 'app/src/test/java/com/example/navigation/CollaborationTargetResolverTest.kt'

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f'{label}: expected exactly one match, found {count}')
              return text.replace(old, new, 1)

