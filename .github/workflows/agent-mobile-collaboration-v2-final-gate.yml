name: Final Gate Mobile Collaboration v2

on:
  push:
    branches:
      - feature/mobile-collaboration-v2
    paths:
      - .github/workflows/agent-mobile-collaboration-v2-final-gate.yml
      - .github/scripts/finalize_mobile_collaboration_v2.py
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: mobile-collaboration-v2-${{ github.ref }}
  cancel-in-progress: false

jobs:
  final-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
      - name: Check out implementation branch
        uses: actions/checkout@v4
        with:
          ref: feature/mobile-collaboration-v2
          fetch-depth: 0

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Reconcile queued implementation passes
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f app/src/main/java/com/example/data/local/AppMigrations.kt ]]; then
            python3 .github/scripts/implement_mobile_collaboration_v2_data.py
            python3 .github/scripts/implement_mobile_collaboration_v2_ui_models.py
            python3 .github/scripts/implement_mobile_collaboration_v2_integration.py
            python3 .github/scripts/implement_mobile_collaboration_v2_validation.py
          fi
          if [[ -f .github/scripts/repair_mobile_collaboration_v2.py ]]; then
            python3 .github/scripts/repair_mobile_collaboration_v2.py
          fi
          if [[ -f .github/scripts/harden_mobile_collaboration_v2.py ]]; then
            python3 .github/scripts/harden_mobile_collaboration_v2.py
          fi
          python3 .github/scripts/finalize_mobile_collaboration_v2.py
          git diff --check

      - name: First-principles product and security invariants
        shell: bash
        run: |
          set -euo pipefail
          ! grep -R "fallbackToDestructiveMigration" -n app/src 2>/dev/null
          ! grep -R "data class WbsTask\|class WbsTask" -n app/src 2>/dev/null
          ! grep -R "ExistingWorkPolicy.REPLACE" -n app/src/main/java/com/example/sync 2>/dev/null
          ! grep -R "http://" -n app/src/main/java/com/example/sync 2>/dev/null
          grep -R "WBS(\"WBS\"" -n app/src/main/java/com/example/ui/screens/RepoDetailScreen.kt
          grep -R "MobileMyWorkScreen" -n app/src/main/java/com/example/MainActivity.kt
          grep -R "UnifiedExploreScreen" -n app/src/main/java/com/example/MainActivity.kt
          grep -R "PersonalCenterSwitchScreen" -n app/src/main/java/com/example/MainActivity.kt
          grep -R "addMigrations(AppMigrations.MIGRATION_4_5)" -n app/src/main/java
          grep -R "database.withTransaction" -n app/src/main/java/com/example/sync/RemoteSync.kt
          grep -R "MAX_SYNC_PAYLOAD_CHARS" -n app/src/main/java/com/example/sync/RemoteSync.kt
          grep -R "untrusted sync hint" -n app/src/main/java
          grep -R "log.repoId in visibleRepositoryIds" -n app/src/main/java/com/example/ui/model/ExperienceProjections.kt
          git diff --check

      - name: Run JVM test suite and assemble Debug APK
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          chmod +x ./gradlew
          ./gradlew --no-daemon testDebugUnitTest assembleDebug --stacktrace 2>&1 | tee /tmp/mobile-v2-final-gate.log
          status=${PIPESTATUS[0]}
          if [[ $status -ne 0 ]]; then
            tail -n 320 /tmp/mobile-v2-final-gate.log > /tmp/mobile-v2-final-tail.log
            {
              echo '### Final gate failed — PR remains draft'
              echo
              echo '```text'
              cat /tmp/mobile-v2-final-tail.log
              echo '```'
            } > /tmp/mobile-v2-final-comment.md
            gh pr comment 21 --repo 963sup/Kotlin-No-Code-Collaboration --body-file /tmp/mobile-v2-final-comment.md || true
            exit $status
          fi

      - name: Remove temporary write-capable automation
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/scripts/implement_mobile_collaboration_v2_data.py
          rm -f .github/scripts/implement_mobile_collaboration_v2_ui_models.py
          rm -f .github/scripts/implement_mobile_collaboration_v2_integration.py
          rm -f .github/scripts/implement_mobile_collaboration_v2_validation.py
          rm -f .github/scripts/repair_mobile_collaboration_v2.py
          rm -f .github/scripts/harden_mobile_collaboration_v2.py
          rm -f .github/scripts/finalize_mobile_collaboration_v2.py
          rm -f .github/workflows/agent-mobile-collaboration-v2.yml
          rm -f .github/workflows/agent-mobile-collaboration-v2-repair.yml
          rm -f .github/workflows/agent-mobile-collaboration-v2-security.yml
          rm -f .github/workflows/agent-mobile-collaboration-v2-final-gate.yml
          rm -f .github/workflows/agent-collaboration-target-workloop.yml
          rm -f .github/mobile-v2-build-failure.log
          rm -f .github/mobile-v2-security-failure.log
          git diff --check

      - name: Commit final verified branch
        shell: bash
        env:
          BRANCH_NAME: feature/mobile-collaboration-v2
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "feat: finalize mobile collaboration v2"
            git push origin "HEAD:${BRANCH_NAME}"
          fi

      - name: Mark PR ready and record gate evidence
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh pr ready 21 --repo 963sup/Kotlin-No-Code-Collaboration || true
          sha=$(git rev-parse HEAD)
          gh pr comment 21 --repo 963sup/Kotlin-No-Code-Collaboration --body "Final gate passed at \`${sha}\`: \`testDebugUnitTest\`, \`assembleDebug\`, static product invariants, and sync/security invariants all completed. Temporary write-capable workflows and scripts were removed from the branch."

      - name: Upload final verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-collaboration-v2-final-gate
          if-no-files-found: ignore
          path: |
            /tmp/mobile-v2-final-gate.log
            app/build/reports/tests/
            app/build/outputs/apk/debug/*.apk
